<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MartClick</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="#">⌂ <b>Mart<span>Click</span></b></a><nav><button class="active">Cliente</button></nav></header><main><h1>Olá! 👋</h1><p>Escreva o que está faltando. A gente recebe sua lista pelo WhatsApp.</p><p class="delivery-note">Programe a sua entrega</p><button class="audio" id="voice" type="button" aria-pressed="false" aria-describedby="voice-status">🎤 &nbsp; Mandar lista por áudio</button><p id="voice-status" class="sr" aria-live="polite"></p><form id="form"><section><label class="sr" for="items">Lista</label><textarea id="items" placeholder="Escreva o que está faltando: arroz, leite..." required></textarea><label class="sr" for="name">Nome</label><input id="name" placeholder="Seu nome"><label class="sr" for="phone">WhatsApp</label><input id="phone" placeholder="Seu WhatsApp"><label class="sr" for="address">Endereço</label><input id="address" placeholder="Endereço - Serrana-SP" required></section><button class="send">Montar minha lista</button><output id="status"></output></form></main><script src="script.js"></script></body></html>
