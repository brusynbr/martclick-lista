<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MartClick</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="#">⌂ <b>Mart<span>Click</span></b></a><nav><button class="active">Cliente</button><button>Wagner</button></nav></header><main><h1>Oi, vizinha! 👋</h1><p>Mande sua lista. Entregamos em até 90 minutos.</p><button class="audio" id="voice">🎤 &nbsp; Mandar lista por áudio</button><form id="form"><section><label class="sr" for="items">Lista</label><textarea id="items" placeholder="Escreva o que está faltando: arroz, leite..." required></textarea><label class="sr" for="name">Nome</label><input id="name" placeholder="Seu nome"><label class="sr" for="phone">WhatsApp</label><input id="phone" placeholder="Seu WhatsApp"><label class="sr" for="address">Endereço</label><input id="address" placeholder="Endereço - Serrana-SP" required></section><button class="send">Montar minha lista</button><output id="status"></output></form></main><dialog id="dialog"><button id="close">×</button><h2>Lista por áudio</h2><p>Envie seu áudio pelo WhatsApp após montar a lista.</p></dialog><script src="script.js"></script></body></html>
